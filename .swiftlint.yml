# SwiftLint configuration — Agile Self
# Run: swiftlint (install via `brew install swiftlint`). No Xcode build phase is wired,
# so this is opt-in / CI-friendly and never blocks local builds.

included:
  - agile-self
  - AgileSelfWidget
  - ScreenTimeReport
  - agile-self Watch App

excluded:
  - agile-selfTests
  - agile-selfUITests
  - agile-self Watch AppTests
  - agile-self Watch AppUITests
  - "**/*.generated.swift"

disabled_rules:
  - trailing_whitespace      # handled by SwiftFormat
  - todo                     # allow TODO/FIXME during active development

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil

line_length:
  warning: 140
  error: 220
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 450
  error: 700

file_length:
  warning: 650
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 150

identifier_name:
  min_length: 1
  excluded: [id, x, y, r, g, b, c, v, p, qs]

cyclomatic_complexity:
  warning: 15
